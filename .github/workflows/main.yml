name: Uradhura

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      job:
        description: 'Deploy manually'
        required: true
        default: 'deploy'

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: ${{ github.event.repository.name }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOYMENT_HOST: ${{ secrets.DEPLOYMENT_HOST }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          override: true

      - name: Build
        run: cargo build --all --release && strip target/release/$PROJECT_NAME

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: uradhura-binary
          path: target/release/${{ env.PROJECT_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: dev
    if: ${{ github.event.inputs.job == 'deploy' || github.event_name == 'push' }}

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: uradhura-binary
          path: target/release/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod -R 700 ~/.ssh
          cd ~/.ssh

          # Write private key safely preserving newlines
          echo "$SSH_PRIVATE_KEY" > id_rsa
          chmod 400 id_rsa

          ssh-keyscan $DEPLOYMENT_HOST >> known_hosts
          chmod 644 known_hosts

      - name: Ensure remote directory exists
        run: ssh $SSH_USER@$DEPLOYMENT_HOST "mkdir -p /home/$SSH_USER/uradhura/"

      - name: Rsync binary
        run: rsync -avz target/release/$PROJECT_NAME $SSH_USER@$DEPLOYMENT_HOST:/home/$SSH_USER/uradhura/

      - name: Restart uradhura.service
        run: ssh $SSH_USER@$DEPLOYMENT_HOST "systemctl --user restart uradhura.service"

  release:    
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: uradhura-binary
          path: target/release/

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/${{ env.PROJECT_NAME }}
